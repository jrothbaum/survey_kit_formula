[project]
name = "survey-kit-formula"
version = "0.1.0"
description = "A polars-native clone of R's formula/model.matrix semantics"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "polars>=1.28.1",
    "numpy>=2.0",
    "scipy>=1.14",
    "narwhals>=2.24.0",
]

[dependency-groups]
dev = [
    "duckdb>=1.5.5",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/survey_kit_formula"]

[tool.pytest.ini_options]
testpaths = ["tests"]
